{% extends 'base.html' %} {% block content %}
<h2>My Bookings</h2>
<table class="table">
  <thead>
    <tr>
      <th>Service</th>
      <th>Date</th>
      <th>Time</th>
      <th>Status</th>
      <th>Paid</th>
    </tr>
  </thead>
  <tbody>
    {% for b in bookings %}
    <tr>
      <td>{{ b.service.name }}</td>
      <td>{{ b.date }}</td>
      <td>{{ b.time }}</td>
      <td>{{ b.get_status_display }}</td>
      <td>{{ b.is_paid }}</td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="5">No bookings found.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
