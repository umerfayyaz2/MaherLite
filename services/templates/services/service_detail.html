{% extends "base.html" %} {% load static %} {% block title %}{{ service.name }}
| MahirLite{% endblock title %} {% block content %}

<section class="py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
          {% if service.image %}
          <img
            src="{{ service.image.url }}"
            class="w-100"
            alt="{{ service.name }}"
            style="max-height: 400px; object-fit: cover"
          />
          {% else %}
          <img
            src="{% static 'img/default-service.jpg' %}"
            class="w-100"
            alt="Default service"
            style="max-height: 400px; object-fit: cover"
          />
          {% endif %}

          <div class="card-body p-4">
            <h2 class="fw-bold text-dark mb-3">{{ service.name }}</h2>
            <p class="text-muted mb-4">{{ service.description }}</p>
            <h4 class="text-primary fw-semibold mb-4">${{ service.price }}</h4>

            <div class="d-flex gap-3">
              <!-- ✅ Fixed safe fallback button -->
              <a
                href="/bookings/"
                class="btn btn-primary rounded-pill px-4 py-2"
              >
                <i class="bi bi-calendar-check me-2"></i> Book Now
              </a>

              <a
                href="{% url 'service_list' %}"
                class="btn btn-outline-secondary rounded-pill px-4 py-2"
              >
                <i class="bi bi-arrow-left me-1"></i> Back to Services
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock content %}
